/* ------------- Hash router ------------- */
const useHashRoute = () => {
  const [hash, setHash] = React.useState(() => window.location.hash.replace(/^#/, '') || '/app');
  React.useEffect(() => {
    const onHash = () => {
      setHash(window.location.hash.replace(/^#/, '') || '/app');
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const navigate = (to) => { window.location.hash = to.replace(/^#/, ''); };
  return [hash, navigate];
};

/* ======================================================================
   Contigo API — helper compartilhado com a landing
   ====================================================================== */
const CONTIGO_API_BASE = (() => {
  if (typeof window !== 'undefined' && window.CONTIGO_API_BASE) return window.CONTIGO_API_BASE;
  if (typeof window !== 'undefined' && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname)) {
    return 'http://localhost:3333';
  }
  return 'https://contigo-api-production.up.railway.app';
})();

class AppApiError extends Error {
  constructor(payload, status) {
    super((payload && payload.message) || 'Erro inesperado.');
    this.error = (payload && payload.error) || 'UNKNOWN';
    this.details = payload && payload.details;
    this.status = status;
  }
}

async function contigoApi(path, opts = {}) {
  const token = (() => { try { return localStorage.getItem('contigo_token'); } catch { return null; } })();
  const headers = {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...(opts.headers || {}),
  };
  const res = await fetch(`${CONTIGO_API_BASE}${path}`, { ...opts, headers });
  if (res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  const body = ct.includes('application/json') ? await res.json() : await res.text();
  if (!res.ok) throw new AppApiError(body, res.status);
  return body;
}

function logoutAndGoToLogin() {
  try {
    localStorage.removeItem('contigo_token');
    localStorage.removeItem('contigo_user');
    localStorage.removeItem('contigo_state_v1');
  } catch {}
  window.location.href = 'Contigo.html#/login';
}

/* ======================================================================

const HUMORS = [

];

const TAGS_ALL = [
  'ansioso','cansado','motivado','irritado','triste','em paz','sobrecarregado','animado',
  'sozinho','acolhido','inquieto','focado','saudoso','grato','vazio','conectado'

const PERIODS = [
  { key:'manha',  label:'manhã',  greet:'Bom dia',   range:[5, 12] },
  { key:'tarde',  label:'tarde',  greet:'Boa tarde', range:[12, 18] },

];
const currentPeriod = (d = new Date()) => {
  const h = d.getHours();
  if (h >= 5 && h < 12) return PERIODS[0];
  if (h >= 12 && h < 18) return PERIODS[1];
  return PERIODS[2];
};

const LS_KEY = 'contigo_state_v1';
const defaultUser = {
  nome: 'Você',
  email: 'voce@email.com',
  configuracoes: {
    horariosCheckIn: { manha:'09:00', tarde:'14:00', noite:'21:00' },
    frequencia: 3, // 1, 2 ou 3
    fazTerapia: null,
    onboarded: false,
  }
};
const loadState = () => {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return null;
};
const saveState = (s) => { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} };

/* Seed 14 days of mock check-ins (deterministic-ish). */
function seedCheckIns() {
  const now = new Date();
  const out = [];
  const tagBag = ['ansioso','cansado','focado','grato','sobrecarregado','em paz','conectado','acolhido','motivado','inquieto','animado','saudoso'];
  let idCounter = 1;
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(now.getDate() - i);
    // randomize how many periods recorded
    const hasM = Math.random() > 0.15;
    const hasT = Math.random() > 0.25;
    const hasN = Math.random() > 0.10;
    const plan = [];
    if (hasM) plan.push({ p:'manha', h:9 + Math.random()*1.5 });
    if (hasT) plan.push({ p:'tarde', h:13 + Math.random()*2 });
    if (hasN) plan.push({ p:'noite', h:20 + Math.random()*2 });
    // build a weekly trend: middle of period happier, mon/tue heavier
    const dayOfWeek = d.getDay();
    const base = (dayOfWeek === 1 || dayOfWeek === 2) ? 2.6 : (dayOfWeek === 5 || dayOfWeek === 6) ? 4.0 : 3.3;
    plan.forEach(({p, h}) => {
      const hour = Math.floor(h);
      const mm = Math.floor((h-hour)*60);
      const hh = String(hour).padStart(2,'0');
      const mms = String(mm).padStart(2,'0');
      const noise = (Math.random() - 0.5) * 1.4;
      const humor = Math.max(1, Math.min(5, Math.round(base + noise + (p==='noite' ? -0.2 : p==='manha' ? 0.1 : 0))));
      // pick 1-3 tags
      const nTags = Math.random() < 0.3 ? 0 : (Math.random() < 0.6 ? 2 : 3);
      const shuffled = [...tagBag].sort(() => Math.random()-0.5);
      const tags = shuffled.slice(0, nTags);
      const withNote = Math.random() < 0.3;
      const notes = [
        'reunião longa. precisei de ar.',
        'almoço com a Clara. saí mais leve.',
        'acordei sem vontade, mas fui.',
        'insônia de novo. tá difícil.',
        'terminei aquele relatório. alívio.',
        'caminhada de manhã ajudou.',
        'briga boba com meu pai.',
        'li um trecho que mexeu comigo.',
      ];
      out.push({
        id: `seed-${idCounter++}`,
        data: d.toISOString().slice(0,10),
        hora: `${hh}:${mms}`,
        periodo: p,
        humor,
        tags,
        nota: withNote ? notes[Math.floor(Math.random()*notes.length)] : '',
      });
    });
  }
  return out;
}

/* Ensure state exists; seed on first load */
function initState() {
  let s = loadState();
  if (!s) {
    s = {
      user: JSON.parse(JSON.stringify(defaultUser)),
      checkIns: seedCheckIns(),
      demo: true,
    };
    // try to pick up name from landing cadastro
    try {
      const u = JSON.parse(localStorage.getItem('contigo_user') || '{}');
      if (u && u.nome) s.user.nome = u.nome;
      else if (u && u.name) s.user.nome = u.name;
      if (u && u.email) s.user.email = u.email;
    } catch {}
    saveState(s);
  }
  return s;
}

/* ------------- global state hook ------------- */
const StateCtx = React.createContext(null);
const useApp = () => React.useContext(StateCtx);

/* Converte a resposta de /me (user) para o formato esperado pelos componentes. */
function normalizeUserFromApi(u) {
  return {
    nome: u.nome || 'Você',
    email: u.email || '',
    configuracoes: {
      horariosCheckIn: {
        manha: (u.configuracoes && u.configuracoes.horariosCheckIn && u.configuracoes.horariosCheckIn.manha) || '09:00',
        tarde: (u.configuracoes && u.configuracoes.horariosCheckIn && u.configuracoes.horariosCheckIn.tarde) || '14:00',
        noite: (u.configuracoes && u.configuracoes.horariosCheckIn && u.configuracoes.horariosCheckIn.noite) || '21:00',
      },
      frequencia: (u.configuracoes && u.configuracoes.frequencia) || 3,
      fazTerapia: (u.configuracoes && u.configuracoes.fazTerapia !== undefined) ? u.configuracoes.fazTerapia : null,
      onboarded: !!(u.configuracoes && u.configuracoes.onboarded),
    },
  };
}

function StateProvider({ children }) {
  const [state, setState] = React.useState(null); // null = carregando
  const [loadError, setLoadError] = React.useState(null);

  // Boot: se tem token, carrega /me e check-ins. Senão, manda pra login.
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      const token = (() => { try { return localStorage.getItem('contigo_token'); } catch { return null; } })();
      if (!token) { logoutAndGoToLogin(); return; }
      try {
        const [meRes, ciRes] = await Promise.all([
          contigoApi('/me'),
          contigoApi('/check-ins?range=all&limit=500'),
        ]);
        if (cancelled) return;
        setState({
          user: normalizeUserFromApi(meRes.user),
          checkIns: (ciRes.checkIns || []).map(c => ({
            id: c.id,
            data: c.data,
            hora: c.hora,
            periodo: c.periodo,
            humor: c.humor,
            tags: c.tags || [],
            nota: c.nota || '',
          })),
          demo: false,
        });
      } catch (err) {
        if (cancelled) return;
        if (err && err.status === 401) {
          logoutAndGoToLogin();
          return;
        }
        setLoadError('Não consegui carregar seus dados agora. Confira sua conexão e tente recarregar.');
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Optimistic: atualiza o state imediatamente e dispara a chamada à API em background.
  // Se a chamada falhar, volta atrás e mostra um aviso simples (console, por enquanto).
  const optimistic = (mutator, apiCall) => {
    let rollback;
    setState(prev => {
      rollback = prev;
      return mutator(prev);
    });
    apiCall().catch(err => {
      console.error('[contigo] falha ao sincronizar com o servidor', err);
      if (err && err.status === 401) { logoutAndGoToLogin(); return; }
      if (rollback) setState(rollback);
    });
  };

  const api = {
    state,
    setUser: (patch) => {
      optimistic(
        s => ({ ...s, user: { ...s.user, ...patch } }),
        () => {
          const body = {};
          if (patch.nome !== undefined) body.nome = patch.nome;
          if (Object.keys(body).length === 0) return Promise.resolve();
          return contigoApi('/me', { method: 'PATCH', body: JSON.stringify(body) });
        }
      );
    },
    setConfig: (patch) => {
      optimistic(
        s => ({ ...s, user: { ...s.user, configuracoes: { ...s.user.configuracoes, ...patch } } }),
        () => contigoApi('/me/config', { method: 'PATCH', body: JSON.stringify(patch) })
      );
    },
    addCheckIn: (ci) => {
      // Gera id temporário para render otimista; substitui quando a API responder
      const tempId = `tmp-${Date.now()}`;
      setState(prev => ({ ...prev, checkIns: [...prev.checkIns, { id: tempId, ...ci }] }));
      contigoApi('/check-ins', {
        method: 'POST',
        body: JSON.stringify({
          humor: ci.humor,
          tags: ci.tags || [],
          nota: ci.nota || '',
          data: ci.data,
          hora: ci.hora,
          periodo: ci.periodo,
        }),
      }).then(res => {
        const saved = res.checkIn;
        setState(prev => ({
          ...prev,
          checkIns: prev.checkIns.map(c => c.id === tempId ? {
            id: saved.id,
            data: saved.data,
            hora: saved.hora,
            periodo: saved.periodo,
            humor: saved.humor,
            tags: saved.tags || [],
            nota: saved.nota || '',
          } : c),
        }));
      }).catch(err => {
        console.error('[contigo] falha ao salvar check-in', err);
        if (err && err.status === 401) { logoutAndGoToLogin(); return; }
        // Remove o check-in otimista se a API falhou
        setState(prev => ({ ...prev, checkIns: prev.checkIns.filter(c => c.id !== tempId) }));
      });
    },
    removeCheckIn: (id) => {
      optimistic(
        s => ({ ...s, checkIns: s.checkIns.filter(c => c.id !== id) }),
        () => contigoApi(`/check-ins/${encodeURIComponent(id)}`, { method: 'DELETE' })
      );
    },

  if (!state) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-cream">
        <div className="flex items-center gap-3 text-ink/55">
          <span className="w-4 h-4 rounded-full border-2 border-ink/20 border-t-ink/60 animate-spin"/>
          <span className="text-[14px]">carregando seu espaço...</span>
        </div>
      </div>
    );
  }

  return <StateCtx.Provider value={api}>{children}</StateCtx.Provider>;
}

/* ------------- date helpers ------------- */
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DIAS_S = ['dom','seg','ter','qua','qui','sex','sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_S = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const formatDateLong = (iso) => {
  const d = new Date(iso + 'T00:00:00');
  return `${DIAS[d.getDay()].replace(/^./, c=>c.toUpperCase())}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
};
const formatDateShort = (iso) => {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} de ${MESES_S[d.getMonth()]}`;
};
const todayISO = () => new Date().toISOString().slice(0,10);
const daysAgoISO = (n) => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const weekStart = (ref = new Date()) => {
  const d = new Date(ref);
  const dow = d.getDay();
  // week = monday-sunday
  const offset = (dow + 6) % 7;
  d.setDate(d.getDate() - offset);
  return d;
};
const weekRangeLabel = (start) => {
  const end = new Date(start); end.setDate(start.getDate()+6);
  return `${start.getDate()} de ${MESES_S[start.getMonth()]} — ${end.getDate()} de ${MESES_S[end.getMonth()]}`;
};

/* Mini 7-day chart (pure SVG, no recharts) */
function Mini7DayChart({ checkIns }) {
  // average humor by day for last 7 days
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const iso = daysAgoISO(i);
    const todays = checkIns.filter(c => c.data === iso);
    const avg = todays.length ? (todays.reduce((a,b)=>a+b.humor,0)/todays.length) : null;
    const d = new Date(iso+'T00:00:00');
    days.push({ iso, dow:DIAS_S[d.getDay()], avg });
  }
  const H = 96, PAD = 8;
  const W = 560;
  const stepX = (W - 24) / (days.length - 1);
  const y = v => PAD + ((5 - v) / 4) * (H - PAD*2);

  // Build smooth path only across consecutive points that have values
  const pts = days.map((d,i) => d.avg == null ? null : [12 + i*stepX, y(d.avg)]);
  let path = '';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (!p) continue;
    if (path === '' || !pts[i-1]) path += `M ${p[0]} ${p[1]}`;
    else {
      const [x0,y0] = pts[i-1], [x1,y1] = p;
      const cx = (x0+x1)/2;
      path += ` C ${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`;
    }
  }

  return (
    <svg viewBox={`0 0 ${W} ${H+24}`} className="w-full h-[150px]">
      {[1,2,3,4,5].map(v => (
        <line key={v} x1="12" x2={W-12} y1={y(v)} y2={y(v)} stroke="#E8E4DE" strokeWidth="0.6"/>
      ))}
      <path d={path} stroke="#7A9B8A" strokeWidth="1.8" fill="none" strokeLinecap="round"/>
      {pts.map((p,i) => p ? <circle key={i} cx={p[0]} cy={p[1]} r="3" fill="#FAF8F5" stroke="#7A9B8A" strokeWidth="1.5"/> : null)}
      {days.map((d,i) => (
        <text key={i} x={12 + i*stepX} y={H+18} fontSize="11" fontFamily="Inter" fill="#2A2A2A" opacity="0.45" textAnchor="middle">{d.dow}</text>
      ))}
    </svg>
  );
}

function TopTagsStrip({ checkIns, onTag }) {

  if (sorted.length === 0) {

function Historico() {
  const { state, removeCheckIn } = useApp();
  const [route] = useHashRoute();
  const urlTag = (() => {
    const q = route.split('?')[1];
    if (!q) return null;
    const params = new URLSearchParams(q);
    return params.get('tag');
  })();
  const [range, setRange] = React.useState('7'); // 7 | 30 | all
  const [tagFilter, setTagFilter] = React.useState(urlTag || null);

  React.useEffect(() => { if (urlTag) setTagFilter(urlTag); }, [urlTag]);

  const since = range === 'all' ? '0000-01-01' : daysAgoISO(range === '7' ? 6 : 29);
  const filtered = state.checkIns
    .filter(c => c.data >= since)
    .filter(c => !tagFilter || (c.tags || []).includes(tagFilter))
    .sort((a,b) => (b.data+b.hora).localeCompare(a.data+a.hora));

  // Build top tags of period
  const counts = {};
  state.checkIns.filter(c => c.data >= since).forEach(c => (c.tags||[]).forEach(t => counts[t] = (counts[t]||0)+1));
  const topTags = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([t])=>t);

  // group by day
  const byDay = {};
  filtered.forEach(c => { (byDay[c.data] ||= []).push(c); });

  // List of all days in the range (for "sem registros" placeholders)
  const endISO = todayISO();
  const startISO = range === 'all' ? (filtered[filtered.length-1]?.data || endISO) : since;
  const dayList = [];
  {
    const s = new Date(startISO+'T00:00:00'), e = new Date(endISO+'T00:00:00');
    for (let d = new Date(e); d >= s; d.setDate(d.getDate()-1)) {
      dayList.push(d.toISOString().slice(0,10));
    }
  }

  return (
    <div data-screen-label="03 Histórico" className="route-fade max-w-4xl mx-auto px-5 md:px-10 py-8 md:py-12">
      <header className="mb-8">
        <h1 className="font-display text-[36px] md:text-[44px] leading-[1.05] tracking-[-0.02em] text-ink mb-2">Seus registros</h1>
        <p className="text-[15px] text-ink/55">Uma linha do tempo pra olhar quando quiser.</p>
      </header>

      <div className="flex flex-wrap items-center gap-2 mb-6">
        {[
          { v:'7', label:'Últimos 7 dias' },
          { v:'30', label:'Últimos 30 dias' },
          { v:'all', label:'Tudo' },
        ].map(f => (
          <button key={f.v} onClick={()=>setRange(f.v)}
            className={"px-4 py-2 rounded-full text-[13px] transition-all duration-300 border " + (range === f.v
              ? "bg-ink text-cream border-ink"
              : "bg-white border-stone2 text-ink/65 hover:border-ink/40")}>
            {f.label}
          </button>
        ))}
      </div>

      {topTags.length > 0 && (
        <div className="mb-8">
          <div className="text-[11px] tracking-[0.14em] uppercase text-ink/40 mb-2.5">filtrar por tag</div>
          <div className="flex flex-wrap gap-2">
            {topTags.map(t => {
              const sel = tagFilter === t;
              return (
                <button key={t} onClick={()=>setTagFilter(sel ? null : t)}
                  className={"px-3 py-1.5 rounded-full text-[13px] transition-all duration-300 border " + (sel
                    ? "bg-sage-500 border-sage-500 text-cream"
                    : "bg-sage-50 border-sage-100 text-sage-700 hover:border-sage-300")}>
                  {t}
                </button>
              );
            })}
            {tagFilter && (
              <button onClick={()=>setTagFilter(null)} className="px-3 py-1.5 rounded-full text-[13px] text-ink/55 hover:text-ink">
                limpar
              </button>
            )}
          </div>
        </div>
      )}

      {state.checkIns.length === 0 ? (
        <EmptyState/>
      ) : filtered.length === 0 ? (
        <div className="bg-white rounded-2xl border border-stone2/70 p-10 text-center">
          <p className="font-display text-[20px] text-ink/70">Nenhum registro nesse filtro.</p>
          <p className="text-[13.5px] text-ink/50 mt-2">Tente outro período ou limpe a tag.</p>
        </div>
      ) : (
        <div className="space-y-10">
          {dayList.map(iso => {
            const cis = byDay[iso];
            return (
              <section key={iso}>
                <h2 className="font-display text-[20px] md:text-[22px] tracking-[-0.01em] text-ink mb-4">{formatDateLong(iso)}</h2>
                {cis && cis.length > 0 ? (
                  <div className="space-y-3">
                    {cis.sort((a,b)=>a.hora.localeCompare(b.hora)).map(ci => (
                      <CheckInCard key={ci.id} ci={ci} onRemove={removeCheckIn}/>

                  <div className="text-[13.5px] text-ink/40 italic pl-1">sem registros nesse dia</div>

  );

function WeekChart({ weekData, onPickDay }) {
  const H = 220, PAD_Y = 30;
  const W = 720;
  const left = 64, right = 20;
  const stepX = (W - left - right) / 6;
  const y = v => PAD_Y + ((5 - v) / 4) * (H - PAD_Y*2);

  const pts = weekData.map((d,i) => d.avg == null ? null : [left + i*stepX, y(d.avg)]);
  let path = '';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (!p) continue;
    if (path === '' || !pts[i-1]) path += `M ${p[0]} ${p[1]}`;
    else {
      const [x0,y0] = pts[i-1], [x1,y1] = p;
      const cx = (x0+x1)/2;
      path += ` C ${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`;
    }
  }
  // area
  let area = '';
  const areaPts = pts.filter(Boolean);
  if (areaPts.length) {
    area += path + ` L ${areaPts[areaPts.length-1][0]} ${H-PAD_Y} L ${areaPts[0][0]} ${H-PAD_Y} Z`;
  }

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-[240px] md:h-[280px]">
      {/* Y axis labels */}
      {[1,2,3,4,5].map(v => (
        <g key={v}>
          <line x1={left} x2={W-right} y1={y(v)} y2={y(v)} stroke="#E8E4DE" strokeWidth="0.6"/>
          <text x={left-10} y={y(v)+4} textAnchor="end" fontSize="11" fontFamily="Inter" fill="#2A2A2A" opacity="0.45">
            {humorOf(v).label}
          </text>
        </g>
      ))}
      {/* area */}
      <path d={area} fill="#7A9B8A" opacity="0.08"/>
      {/* line */}
      <path d={path} stroke="#5F7D6D" strokeWidth="2" fill="none" strokeLinecap="round"/>
      {/* points */}
      {pts.map((p,i) => p ? (
        <g key={i} className="cursor-pointer" onClick={()=>onPickDay && onPickDay(weekData[i].iso)}>
          <circle cx={p[0]} cy={p[1]} r="12" fill="transparent"/>
          <circle cx={p[0]} cy={p[1]} r="5" fill="#FAF8F5" stroke="#5F7D6D" strokeWidth="1.8"/>
        </g>
      ) : null)}
      {/* X labels */}
      {weekData.map((d,i) => (
        <text key={i} x={left + i*stepX} y={H-8} textAnchor="middle" fontSize="11" fontFamily="Inter" fill="#2A2A2A" opacity="0.55">{d.dow}</text>
      ))}
    </svg>
  );
}

function Relatorio() {
  const { state } = useApp();
  const [weekOffset, setWeekOffset] = React.useState(0);
  const [dayModal, setDayModal] = React.useState(null);

  const start = (() => { const s = weekStart(); s.setDate(s.getDate() + weekOffset*7); return s; })();
  const prevStart = new Date(start); prevStart.setDate(prevStart.getDate() - 7);
  const end = new Date(start); end.setDate(start.getDate()+6);

  // week data by day
  const weekData = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const iso = d.toISOString().slice(0,10);
    const cis = state.checkIns.filter(c => c.data === iso);
    const avg = cis.length ? cis.reduce((a,b)=>a+b.humor,0)/cis.length : null;
    weekData.push({ iso, dow: DIAS_S[d.getDay()], avg, cis });
  }
  const weekCIs = weekData.flatMap(d => d.cis);
  const prevWeekCIs = state.checkIns.filter(c => {
    const cd = new Date(c.data+'T00:00:00');
    return cd >= prevStart && cd < start;
  });

  // period stats
  const byPeriod = { manha:[], tarde:[], noite:[] };
  weekCIs.forEach(c => { (byPeriod[c.periodo] ||= []).push(c); });
  const periodStat = (key) => {
    const arr = byPeriod[key] || [];
    if (!arr.length) return { avg:null, topTag:null, n:0 };
    const avg = arr.reduce((a,b)=>a+b.humor,0)/arr.length;
    const counts = {};
    arr.forEach(c => (c.tags||[]).forEach(t => counts[t] = (counts[t]||0)+1));
    const topTag = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;
    return { avg, topTag, n:arr.length };
  };
  const stMan = periodStat('manha'), stTar = periodStat('tarde'), stNoi = periodStat('noite');

  // tag counts
  const tagCounts = {};
  weekCIs.forEach(c => (c.tags||[]).forEach(t => tagCounts[t] = (tagCounts[t]||0)+1));
  const sortedTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]);
  const maxTag = sortedTags[0]?.[1] || 1;

  // notes
  const notes = weekCIs.filter(c => c.nota && c.nota.trim().length > 0)
    .sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));

  // comparison with prev week
  const diffN = weekCIs.length - prevWeekCIs.length;
  const prevTagCounts = {};
  prevWeekCIs.forEach(c => (c.tags||[]).forEach(t => prevTagCounts[t] = (prevTagCounts[t]||0)+1));
  const diffLines = [];
  if (prevWeekCIs.length > 0 || weekCIs.length > 0) {
    diffLines.push(diffN === 0
      ? `Você fez o mesmo número de registros que a semana passada (${weekCIs.length}).`
      : diffN > 0
        ? `Essa semana teve mais registros que a anterior (${weekCIs.length} vs ${prevWeekCIs.length}).`
        : `Essa semana teve menos registros que a anterior (${weekCIs.length} vs ${prevWeekCIs.length}).`);
    sortedTags.slice(0,3).forEach(([t, n]) => {
      const prev = prevTagCounts[t] || 0;
      if (prev > 0 && prev !== n) {
        const times = prev > n ? (prev/n).toFixed(1) : (n/prev).toFixed(1);
        const dir = n < prev ? 'menos' : 'mais';
        diffLines.push(`A tag "${t}" apareceu ${times}x ${dir} essa semana.`);
      }
    });
  }

  // Context phrase for periods
  let periodPhrase = null;
  if (stMan.avg != null && stNoi.avg != null) {
    if (stMan.avg - stNoi.avg >= 0.5) periodPhrase = "Suas manhãs foram mais leves que suas noites essa semana.";
    else if (stNoi.avg - stMan.avg >= 0.5) periodPhrase = "Suas noites foram mais leves que suas manhãs essa semana.";
    else periodPhrase = "Os três períodos do dia foram parecidos essa semana.";
  }

  const handleExport = () => window.print();

  return (
    <div data-screen-label="04 Relatório" className="route-fade max-w-4xl mx-auto px-5 md:px-10 py-8 md:py-12" id="report-root">
      <header className="mb-8 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
        <div>
          <div className="text-[12px] tracking-[0.2em] uppercase text-sage-700 mb-3">relatório</div>
          <h1 className="font-display text-[40px] md:text-[52px] leading-[1.05] tracking-[-0.02em] text-ink">Sua semana</h1>
          <div className="mt-4">
            <WeekPicker start={start} onShift={d=>setWeekOffset(w=>w+d)}/>
          </div>
        </div>
        <button onClick={handleExport} className="no-print inline-flex items-center gap-2 px-4 py-2.5 rounded-full border border-stone2 bg-white text-[13.5px] text-ink/75 hover:border-ink/40 transition-colors">
          <IcDownload size={15}/> Exportar em PDF
        </button>
      </header>

      {/* Section 1 — chart */}
      <section className="bg-white rounded-3xl border border-stone2/70 shadow-softer p-6 md:p-8 mb-6">
        <div className="flex items-baseline justify-between mb-3">
          <h2 className="font-display text-[22px] text-ink">Humor ao longo da semana</h2>
          <span className="text-[12.5px] text-ink/50">clique num ponto pra ver o dia</span>
        </div>
        <WeekChart weekData={weekData} onPickDay={(iso)=>setDayModal(iso)}/>
      </section>

      {/* Section 2 — periods */}
      <section className="mb-6">
        <h2 className="font-display text-[22px] text-ink mb-1">Padrões por período</h2>
        {periodPhrase && <p className="text-[14.5px] text-ink/55 mb-4 text-pretty">{periodPhrase}</p>}
        <div className="grid md:grid-cols-3 gap-4">
          {[
            { k:'manha', label:'Manhã', s:stMan },
            { k:'tarde', label:'Tarde', s:stTar },
            { k:'noite', label:'Noite', s:stNoi },
          ].map(({k, label, s}) => {
            const h = s.avg == null ? null : humorOf(Math.round(s.avg));
            return (
              <div key={k} className="bg-white rounded-2xl border border-stone2/70 p-6">
                <div className="flex items-center justify-between mb-4">
                  <span className="text-[12px] tracking-[0.14em] uppercase text-ink/45">{label}</span>
                  <span className="text-[12px] text-ink/40">{s.n} {s.n === 1 ? 'registro' : 'registros'}</span>
                </div>
                {s.avg == null ? (
                  <p className="text-[14px] text-ink/45 italic">sem registros</p>
                ) : (
                  <>
                    <div className="flex items-center gap-3 mb-2">
                      <span className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: h.bg, border:`1px solid ${h.ring}` }}>
                        <span className="w-4 h-4 rounded-full" style={{ background:h.color }}/>
                      </span>
                      <div>
                        <div className="font-display text-[24px] leading-none text-ink">{s.avg.toFixed(1)}</div>
                        <div className="text-[12.5px]" style={{ color:h.color }}>média · {h.label.toLowerCase()}</div>
                      </div>
                    </div>
                    {s.topTag && (
                      <div className="mt-3 text-[13px] text-ink/60">
                        mais presente: <span className="px-2 py-0.5 rounded-full bg-sage-50 border border-sage-100 text-sage-700">{s.topTag}</span>
                      </div>
                    )}
                  </>
                )}
              </div>
            );
          })}
        </div>
      </section>

      {/* Section 3 — tags */}
      <section className="bg-white rounded-3xl border border-stone2/70 shadow-softer p-6 md:p-8 mb-6">
        <h2 className="font-display text-[22px] text-ink mb-5">Tags da semana</h2>
        {sortedTags.length === 0 ? (
          <p className="text-[14px] text-ink/45 italic">nenhuma tag usada essa semana</p>
        ) : (
          <div className="grid md:grid-cols-5 gap-8 items-start">
            <div className="md:col-span-3">
              <div className="flex flex-wrap items-baseline gap-x-3 gap-y-2">
                {sortedTags.map(([t, n]) => {
                  const ratio = n / maxTag;
                  const size = 14 + ratio * 20; // 14..34
                  const op = 0.55 + ratio * 0.45;
                  return (
                    <span key={t} className="font-display text-ink" style={{ fontSize:size, opacity:op, lineHeight:1.05 }}>{t}</span>
                  );
                })}
              </div>
            </div>
            <div className="md:col-span-2">
              <div className="text-[11px] tracking-[0.14em] uppercase text-ink/40 mb-3">top 5</div>
              <div className="space-y-2">
                {sortedTags.slice(0,5).map(([t, n]) => (
                  <div key={t} className="flex items-center justify-between text-[14px]">
                    <span className="text-ink/75">{t}</span>
                    <span className="text-ink/50 tabular-nums">{n}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </section>

      {/* Section 4 — notes */}
      <section className="bg-white rounded-3xl border border-stone2/70 shadow-softer p-6 md:p-8 mb-6">
        <div className="text-[12px] tracking-[0.2em] uppercase text-sage-700 mb-2">leve pra sua sessão</div>
        <h2 className="font-display text-[22px] text-ink mb-5">Seus momentos</h2>
        {notes.length === 0 ? (
          <p className="text-[14px] text-ink/45 italic">você não registrou notas escritas essa semana — sem problema.</p>
        ) : (
          <ul className="space-y-5">
            {notes.map(c => {
              const h = humorOf(c.humor);
              return (
                <li key={c.id} className="flex gap-4">
                  <span className="mt-1.5 w-2 h-2 rounded-full shrink-0" style={{ background:h.color }}/>
                  <div>
                    <div className="text-[12px] text-ink/45">{formatDateShort(c.data)} · {c.hora}</div>
                    <p className="font-display italic text-[17px] leading-[1.45] text-ink/85 mt-0.5 text-pretty">"{c.nota}"</p>
                  </div>
                </li>
              );
            })}
          </ul>
        )}
      </section>

      {/* Section 5 — comparison */}
      {diffLines.length > 0 && (
        <section className="bg-sage-50/50 border border-sage-100 rounded-3xl p-6 md:p-8 mb-6">
          <h2 className="font-display text-[22px] text-ink mb-3">Comparado com a semana passada</h2>
          <ul className="space-y-2">
            {diffLines.map((l, i) => (
              <li key={i} className="flex items-start gap-3 text-[14.5px] text-ink/75">
                <span className="mt-2 w-1.5 h-1.5 rounded-full bg-sage-500 shrink-0"/>
                <span>{l}</span>
              </li>
            ))}
          </ul>
        </section>
      )}

      {dayModal && <DayModal iso={dayModal} checkIns={state.checkIns.filter(c=>c.data===dayModal)} onClose={()=>setDayModal(null)}/>}
    </div>
  );
}

function DayModal({ iso, checkIns, onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-6" onClick={onClose}>
      <div className="absolute inset-0 bg-ink/30 backdrop-blur-sm"/>
      <div className="relative bg-cream rounded-t-3xl md:rounded-3xl border border-stone2 w-full max-w-lg max-h-[80vh] overflow-auto p-6 md:p-8 step-in" onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between mb-5">
          <div>
            <div className="text-[11px] tracking-[0.14em] uppercase text-sage-700 mb-1">{checkIns.length} {checkIns.length === 1 ? 'registro' : 'registros'}</div>
            <h3 className="font-display text-[24px] text-ink">{formatDateLong(iso)}</h3>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-stone2/50 flex items-center justify-center text-ink/55"><IcX size={15}/></button>
        </div>
        {checkIns.length === 0 ? (
          <p className="text-[14px] text-ink/45 italic">sem registros nesse dia</p>
        ) : (
          <div className="space-y-3">
            {checkIns.sort((a,b)=>a.hora.localeCompare(b.hora)).map(ci => <CheckInCard key={ci.id} ci={ci}/>)}
          </div>
        )}
      </div>
    </div>
  );
}

/* ======================================================================
   CONFIGURAÇÕES
   ====================================================================== */
function Section({ title, subtitle, children }) {
  return (
    <section className="bg-white rounded-2xl border border-stone2/70 p-6 md:p-8 mb-5">
      <h2 className="font-display text-[20px] text-ink mb-1">{title}</h2>
      {subtitle && <p className="text-[13.5px] text-ink/55 mb-5">{subtitle}</p>}
      <div className={subtitle ? "" : "mt-4"}>{children}</div>
    </section>
  );
}

function Config() {
  const { state, setUser, setConfig, clearAll } = useApp();
  const u = state.user;
  const cfg = u.configuracoes;
  const [nome, setNome] = React.useState(u.nome);
  const [confirmDelete, setConfirmDelete] = React.useState(0);
  const [crisisOpen, setCrisisOpen] = React.useState(false);

  const exportData = (fmt) => {
    if (fmt === 'json') {
      const blob = new Blob([JSON.stringify({ user:u, checkIns:state.checkIns }, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='contigo-dados.json'; a.click(); URL.revokeObjectURL(url);
    } else {
      const lines = ['data,hora,periodo,humor,tags,nota'];
      state.checkIns.forEach(c => {
        const safe = (c.nota || '').replace(/"/g,'""');
        lines.push(`${c.data},${c.hora},${c.periodo},${c.humor},"${(c.tags||[]).join(';')}","${safe}"`);
      });
      const blob = new Blob([lines.join('\n')], { type:'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='contigo-dados.csv'; a.click(); URL.revokeObjectURL(url);
    }
  };

  return (
    <div data-screen-label="05 Config" className="route-fade max-w-3xl mx-auto px-5 md:px-10 py-8 md:py-12">
      <h1 className="font-display text-[36px] md:text-[44px] leading-[1.05] tracking-[-0.02em] text-ink mb-8">Configurações</h1>

      <Section title="Perfil">
        <label className="block mb-4">
          <span className="block text-[13px] text-ink/70 mb-2">Nome</span>
          <div className="flex gap-2">
            <input type="text" className="flex-1 bg-cream border border-stone2 rounded-2xl px-4 py-3 text-[15px] ring-focus" value={nome} onChange={e=>setNome(e.target.value)}/>
            <BtnGhost onClick={()=>setUser({ nome })}>Salvar</BtnGhost>
          </div>
        </label>
        <div className="mb-4">
          <span className="block text-[13px] text-ink/70 mb-2">Email</span>
          <div className="px-4 py-3 rounded-2xl bg-stone2/30 text-ink/70 text-[14.5px]">{u.email}</div>
        </div>
        <BtnGhost>Trocar senha</BtnGhost>
      </Section>

      <Section title="Horários dos check-ins" subtitle="Você receberá um lembrete gentil nesses horários.">
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          {[
            { k:'manha', label:'Manhã' },
            { k:'tarde', label:'Tarde' },
            { k:'noite', label:'Noite' },
          ].map(({k, label}) => (
            <label key={k} className="block">
              <span className="block text-[12px] tracking-[0.14em] uppercase text-ink/45 mb-2">{label}</span>
              <input type="time" value={cfg.horariosCheckIn[k]}
                onChange={e=>setConfig({ horariosCheckIn: { ...cfg.horariosCheckIn, [k]: e.target.value }})}
                className="w-full bg-cream border border-stone2 rounded-2xl px-4 py-3 text-[15px] ring-focus"/>
            </label>
          ))}
        </div>
      </Section>

      <Section title="Frequência">
        <div className="space-y-2">
          {[
            { v:3, label:'3x por dia', hint:'recomendado · manhã, tarde e noite' },
            { v:2, label:'2x por dia', hint:'manhã e noite' },
            { v:1, label:'1x por dia', hint:'só à noite' },
          ].map(opt => {
            const sel = cfg.frequencia === opt.v;
            return (
              <button key={opt.v} onClick={()=>setConfig({ frequencia: opt.v })}
                className={"w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl border text-left transition-all duration-300 " + (sel
                  ? "bg-sage-50 border-sage-300"
                  : "bg-cream border-stone2/60 hover:border-ink/30")}>
                <span className={"w-5 h-5 rounded-full border flex items-center justify-center " + (sel ? "border-sage-500 bg-sage-500" : "border-stone2 bg-white")}>
                  {sel && <span className="w-2 h-2 rounded-full bg-cream"/>}
                </span>
                <div className="flex-1">
                  <div className="text-[14.5px] text-ink">{opt.label}</div>
                  <div className="text-[12.5px] text-ink/50">{opt.hint}</div>
                </div>
              </button>
            );
          })}
        </div>
      </Section>

      <Section title="Seus dados" subtitle="Tudo é seu. Você leva quando quiser.">
        <div className="flex flex-col sm:flex-row gap-3">
          <BtnGhost onClick={()=>exportData('json')}><IcDownload size={15}/> Baixar JSON</BtnGhost>
          <BtnGhost onClick={()=>exportData('csv')}><IcDownload size={15}/> Baixar CSV</BtnGhost>
        </div>
        <div className="mt-8 pt-6 border-t border-stone2/70">
          {confirmDelete === 0 && (
            <button onClick={()=>setConfirmDelete(1)} className="text-[13.5px] text-terra-700 hover:text-terra-800 underline underline-offset-4 decoration-terra-200 hover:decoration-terra-500">Apagar minha conta</button>
          )}
          {confirmDelete === 1 && (
            <div className="bg-terra-50 border border-terra-200 rounded-2xl p-5">
              <p className="text-[14px] text-ink/80 mb-3">Tem certeza? Seus registros serão apagados. Não dá pra desfazer.</p>
              <div className="flex gap-3">
                <button onClick={()=>setConfirmDelete(2)} className="px-4 py-2 rounded-full bg-terra-600 text-cream text-[13px]">Sim, apagar tudo</button>
                <button onClick={()=>setConfirmDelete(0)} className="px-4 py-2 rounded-full border border-stone2 bg-white text-[13px] text-ink/70">Cancelar</button>
              </div>
            </div>
          )}
          {confirmDelete === 2 && (
            <div className="bg-terra-50 border border-terra-300 rounded-2xl p-5">
              <p className="text-[14px] text-ink/80 mb-3"><strong>Última confirmação.</strong> Vamos apagar tudo agora.</p>
              <div className="flex gap-3">
                <button onClick={async ()=>{
                  try {
                    await contigoApi('/me', { method: 'DELETE' });
                  } catch (err) {
                    console.error('[contigo] falha ao apagar conta', err);
                  } finally {
                    logoutAndGoToLogin();
                  }
                }} className="px-4 py-2 rounded-full bg-terra-700 text-cream text-[13px]">Apagar definitivamente</button>
                <button onClick={()=>setConfirmDelete(0)} className="px-4 py-2 rounded-full border border-stone2 bg-white text-[13px] text-ink/70">Não, deixa</button>
              </div>
            </div>
          )}
        </div>
      </Section>

      <Section title="Suporte">
        <div className="space-y-2">
          <button onClick={()=>setCrisisOpen(true)} className="flex items-center gap-3 w-full text-left px-4 py-3 rounded-2xl hover:bg-cream border border-stone2/60 transition-colors">
            <IcHeart size={16} className="text-terra-600"/>
            <span className="text-[14.5px] text-ink/80">Em caso de crise</span>
          </button>
          <a href="mailto:oi@contigo.com.br" className="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-cream border border-stone2/60 transition-colors">
            <IcOut size={16} className="text-ink/55"/>
            <span className="text-[14.5px] text-ink/80">Fale com a gente</span>
          </a>
        </div>
      </Section>

      {crisisOpen && <CrisisModal onClose={()=>setCrisisOpen(false)}/>}
    </div>
  );
}

function CrisisModal({ onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center" onClick={onClose}>
      <div className="absolute inset-0 bg-ink/35 backdrop-blur-sm"/>
      <div className="relative bg-cream rounded-t-3xl md:rounded-3xl border border-stone2 w-full max-w-lg p-6 md:p-8 step-in" onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between mb-4">
          <h3 className="font-display text-[26px] text-ink">Se você precisa de alguém <span className="italic text-sage-700">agora</span>.</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-stone2/50 flex items-center justify-center text-ink/55"><IcX size={16}/></button>
        </div>
        <p className="text-[14.5px] text-ink/65 mb-5 text-pretty">Você não precisa atravessar isso sozinho. Aqui vão alguns caminhos no Brasil, todos gratuitos.</p>
        <div className="space-y-3">
          <a href="tel:188" className="flex items-center gap-4 p-4 bg-white rounded-2xl border border-stone2 hover:border-terra-300 transition-colors">
            <div className="w-10 h-10 rounded-full bg-terra-50 border border-terra-200 flex items-center justify-center"><IcPhone size={16} className="text-terra-600"/></div>
            <div className="flex-1">
              <div className="font-display text-[17px] text-ink">CVV · 188</div>
              <div className="text-[13px] text-ink/55">Centro de Valorização da Vida · atende 24h, gratuito</div>
            </div>
          </a>
          <a href="https://cvv.org.br" target="_blank" rel="noreferrer" className="flex items-center gap-4 p-4 bg-white rounded-2xl border border-stone2 hover:border-sage-300 transition-colors">
            <div className="w-10 h-10 rounded-full bg-sage-50 border border-sage-200 flex items-center justify-center"><IcHeart size={16} className="text-sage-700"/></div>
            <div className="flex-1">
              <div className="font-display text-[17px] text-ink">Chat do CVV</div>
              <div className="text-[13px] text-ink/55">cvv.org.br · conversa por texto, 24h</div>
            </div>
          </a>
          <div className="p-4 bg-white rounded-2xl border border-stone2">
            <div className="font-display text-[17px] text-ink mb-1">CAPS · SUS</div>
            <div className="text-[13px] text-ink/55">Centros de Atenção Psicossocial. Procure o mais próximo pelo site do Ministério da Saúde ou pelo telefone 136.</div>
          </div>
          <div className="p-4 bg-white rounded-2xl border border-stone2">
            <div className="font-display text-[17px] text-ink mb-1">SAMU · 192</div>
            <div className="text-[13px] text-ink/55">Em emergências médicas, incluindo crises psiquiátricas agudas.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   ONBOARDING (3 telas)
   ====================================================================== */
function Onboarding() {
  const { state, setConfig } = useApp();
  const [, navigate] = useHashRoute();
  const [step, setStep] = React.useState(0);
  const [times, setTimes] = React.useState(state.user.configuracoes.horariosCheckIn);
  const [therapy, setTherapy] = React.useState(null);

  const finish = () => {
    // therapy é uma das strings: 'sim, faço', 'ainda não, mas quero começar', 'não faço', 'prefiro não dizer', ou null.
    // Converte pra boolean|null que o back-end aceita.
    let fazTerapia = null;
    if (therapy === 'sim, faço') fazTerapia = true;
    else if (therapy === 'não faço' || therapy === 'ainda não, mas quero começar') fazTerapia = false;
    // 'prefiro não dizer' e null viram null
    setConfig({ horariosCheckIn: times, fazTerapia, onboarded: true });
    navigate('/app');
  };

  return (
    <div data-screen-label="00 Onboarding" className="min-h-screen flex items-center justify-center px-6 py-12 route-fade">
      <div className="w-full max-w-xl">
        <div className="flex items-center gap-1.5 mb-10">
          {[0,1,2].map(i => (
            <span key={i} className="h-[3px] flex-1 rounded-full overflow-hidden bg-stone2/70">
              <span className="block h-full bg-sage-500 transition-all duration-500" style={{ width: i <= step ? '100%' : '0%' }}/>
            </span>
          ))}
        </div>

        <div className="step-in" key={step}>
          {step === 0 && (
            <>
              <div className="mb-8">
                <svg viewBox="0 0 200 80" className="w-[260px]">
                  <path d="M10 50 C 40 10, 80 70, 120 40 S 190 30, 195 50" stroke="#7A9B8A" strokeWidth="1.6" fill="none" opacity="0.65"/>
                </svg>
              </div>
              <h1 className="font-display text-[40px] md:text-[52px] leading-[1.05] tracking-[-0.02em] text-ink mb-5">
                Três momentos do dia.<br/><span className="italic text-sage-700">É só isso.</span>
              </h1>
              <p className="text-[16px] text-ink/60 mb-10 max-w-md text-pretty">
                De manhã, à tarde e à noite, um toque rápido.
                Com o tempo, isso vira um retrato honesto da sua semana.
              </p>
              <BtnPrimary onClick={()=>setStep(1)}>Continuar <IcArr size={15}/></BtnPrimary>
            </>
          )}

          {step === 1 && (
            <>
              <h1 className="font-display text-[32px] md:text-[40px] leading-[1.08] tracking-[-0.02em] text-ink mb-5">
                A que horas você quer <span className="italic text-sage-700">ser lembrado?</span>
              </h1>
              <p className="text-[15px] text-ink/55 mb-8">Dá pra mudar depois.</p>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-10">
                {[
                  { k:'manha', label:'Manhã' },
                  { k:'tarde', label:'Tarde' },
                  { k:'noite', label:'Noite' },
                ].map(({k, label}) => (
                  <label key={k} className="block">
                    <span className="block text-[12px] tracking-[0.14em] uppercase text-ink/45 mb-2">{label}</span>
                    <input type="time" value={times[k]} onChange={e=>setTimes({...times, [k]: e.target.value})}
                      className="w-full bg-white border border-stone2 rounded-2xl px-4 py-3 text-[15px] ring-focus"/>
                  </label>
                ))}
              </div>
              <div className="flex items-center gap-3">
                <BtnPrimary onClick={()=>setStep(2)}>Continuar <IcArr size={15}/></BtnPrimary>
                <button onClick={()=>setStep(0)} className="text-[13.5px] text-ink/55 hover:text-ink px-3">voltar</button>
              </div>
            </>
          )}

          {step === 2 && (
            <>
              <h1 className="font-display text-[32px] md:text-[40px] leading-[1.08] tracking-[-0.02em] text-ink mb-5">
                Você faz terapia <span className="italic text-sage-700">atualmente?</span>
              </h1>
              <p className="text-[15px] text-ink/55 mb-8">Ajuda a gente a ajustar algumas coisas. Sem problema se preferir não responder.</p>
              <div className="space-y-2 mb-10">
                {['sim, faço', 'ainda não, mas quero começar', 'não faço', 'prefiro não dizer'].map(o => {
                  const sel = therapy === o;
                  return (
                    <button key={o} onClick={()=>setTherapy(o)}
                      className={"w-full px-4 py-3.5 rounded-2xl border text-left text-[14.5px] transition-all duration-300 " + (sel
                        ? "bg-sage-50 border-sage-300 text-ink"
                        : "bg-white border-stone2/60 text-ink/70 hover:border-ink/30")}>
                      {o}
                    </button>
                  );
                })}
              </div>
              <div className="flex items-center gap-3">
                <BtnPrimary onClick={finish}>Tudo pronto <IcArr size={15}/></BtnPrimary>
                <button onClick={()=>setStep(1)} className="text-[13.5px] text-ink/55 hover:text-ink px-3">voltar</button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   APP SHELL
   ====================================================================== */
function Shell({ children }) {
  return (
    <div className="min-h-screen flex bg-cream relative">
      <Sidebar/>
      <div className="flex-1 min-w-0 relative">
        <DemoFlag/>
        <MobileTop/>
        <div className="pb-24 md:pb-8">{children}</div>
      </div>
      <BottomNav/>
    </div>
  );
}

function Router() {
  const [route] = useHashRoute();
  const { state } = useApp();
  const path = route.split('?')[0];

  // onboarding gate
  const onboarded = state.user.configuracoes.onboarded;
  // The demo seed sets onboarded implicitly-yes (we skip). But the user can reach /app/onboarding from cadastro.
  if (path === '/app/onboarding') return <Onboarding/>;

  if (path === '/app/check-in') return <Shell><CheckInFlow/></Shell>;
  if (path === '/app/historico') return <Shell><Historico/></Shell>;
  if (path === '/app/relatorio') return <Shell><Relatorio/></Shell>;
  if (path === '/app/config')    return <Shell><Config/></Shell>;

  return <Shell><Dashboard/></Shell>;
}

function App() {
  return (
    <StateProvider>
      <Router/>
    </StateProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
