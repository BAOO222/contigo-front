/* -------------------- Hash router -------------------- */
const useHashRoute = () => {
  const [hash, setHash] = React.useState(() => window.location.hash.replace(/^#/, '') || '/');
  React.useEffect(() => {
    const onHash = () => {
      setHash(window.location.hash.replace(/^#/, '') || '/');
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const navigate = (to) => {
    if (to.startsWith('#')) to = to.slice(1);
    window.location.hash = to;
  };
  return [hash, navigate];
};

const Link = ({ to, className = '', children, ...rest }) => {
  return (
    <a
      href={`#${to}`}
      className={className}
      onClick={(e) => {
        // allow cmd/ctrl click to open new tab behavior if desired (hash links still work)
      }}
      {...rest}
    >
      {children}
    </a>
  );
};

  const data = [

    { d: 'ter', m: 2, t: 2, n: 3 },

    { d: 'sáb', m: 5, t: 4, n: 4 },
    { d: 'dom', m: 4, t: 4, n: 5 },

  // Map value (1-5) to y inside a 120px plot area
  const H = 120, PAD = 12;
  const y = v => PAD + ((5 - v) / 4) * (H - PAD * 2);
  const W = 320; // svg width units
  const stepX = (W - 24) / (data.length - 1);
  const line = (key, color) => {
    const pts = data.map((d, i) => [12 + i * stepX, y(d[key])]);
    // smooth path
    let path = `M ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      const cx = (x0 + x1) / 2;
      path += ` C ${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`;
    }
    return (
      <>
        <path d={path} stroke={color} strokeWidth="1.8" fill="none" strokeLinecap="round"/>
        {pts.map(([px, py], i) => (
          <circle key={i} cx={px} cy={py} r="2.4" fill="#FAF8F5" stroke={color} strokeWidth="1.3"/>
        ))}
      </>
    );
  };

  return (
    <div className="relative w-full max-w-[440px]">
      {/* decorative background */}

        <Blob className="absolute -top-8 -right-8 w-72 h-72 opacity-60" from="#D1E0D6" to="#A7BEB1" opacity={0.55}/>

            <div className="text-[11px] tracking-[0.14em] uppercase text-ink/40 mb-1">sua semana</div>

            <div className="font-display text-[22px] leading-none text-sage-700">3,6</div>
          </div>
        </div>

        {/* Chart */}
        <div className="relative">
          <svg viewBox={`0 0 ${W} ${H + 28}`} className="w-full h-[160px]" aria-hidden="true">
            {/* grid */}
            {[1,2,3,4,5].map(v => (
              <line key={v} x1="12" x2={W-12} y1={y(v)} y2={y(v)} stroke="#E8E4DE" strokeWidth="0.6"/>
            ))}
            {/* day labels */}
            {data.map((d,i)=>(
              <text key={d.d} x={12 + i*stepX} y={H+20}
                fontSize="10" fontFamily="Inter" fill="#2A2A2A" opacity="0.45"
                textAnchor="middle">{d.d}</text>
            ))}
            {/* lines */}
            {line('n', '#C77D5F')}
            {line('t', '#A7BEB1')}
            {line('m', '#7A9B8A')}
          </svg>
        </div>

        {/* Legend */}

        <div className="text-[11px] tracking-[0.14em] uppercase text-ink/40 mb-1">ter — noite</div>
        <div className="font-display italic text-[15px] leading-snug text-ink/80">
          "reunião longa. precisei de ar."
        </div>
      </div>
    </div>
  );
};

/* ======================================================================
   Contigo API — helper compartilhado
   - Mesma URL base para dev local (http://localhost:3333)
   - Guarda token no localStorage como 'contigo_token'
   - Em erro, joga AppApiError com .error, .message, .details, .status
   ====================================================================== */
const CONTIGO_API_BASE = (() => {
  if (typeof window !== 'undefined' && window.CONTIGO_API_BASE) return window.CONTIGO_API_BASE;
  if (typeof window !== 'undefined' && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname)) {
    return 'http://localhost:3333';
  }
  return 'https://contigo-api-production.up.railway.app';
})();

class AppApiError extends Error {
  constructor(payload, status) {
    super((payload && payload.message) || 'Erro inesperado.');
    this.error = (payload && payload.error) || 'UNKNOWN';
    this.details = payload && payload.details;
    this.status = status;
  }
}

async function contigoApi(path, opts = {}) {
  const token = (() => { try { return localStorage.getItem('contigo_token'); } catch { return null; } })();
  const headers = {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...(opts.headers || {}),
  };
  const res = await fetch(`${CONTIGO_API_BASE}${path}`, { ...opts, headers });
  if (res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  const body = ct.includes('application/json') ? await res.json() : await res.text();
  if (!res.ok) throw new AppApiError(body, res.status);
  return body;
}

window.contigoApi = contigoApi;
window.AppApiError = AppApiError;

const FormCadastro = ({ onSubmit, submitting }) => {
  const [form, setForm] = React.useState({ name: '', email: '', password: '', terms: false });
  const [touched, setTouched] = React.useState({});
  const [showPw, setShowPw] = React.useState(false);

  const errors = {
    name: form.name.trim().length < 2 ? 'Como você quer ser chamado?' : null,
    email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email) ? 'Digite um email válido.' : null,
    password: form.password.length < 8 ? 'Mínimo 8 caracteres.' : null,
    terms: !form.terms ? 'Concorde com os termos pra continuar.' : null,
  };
  const hasErrors = Object.values(errors).some(Boolean);

  const handleSubmit = (e) => {
    e.preventDefault();
    setTouched({ name: true, email: true, password: true, terms: true });
    if (hasErrors) return;
    onSubmit(form);
  };

  const err = (k) => (touched[k] ? errors[k] : null);

  return (
    <form onSubmit={handleSubmit} noValidate className="route-fade">
      <h1 className="font-display text-[38px] md:text-[44px] leading-[1.05] tracking-[-0.02em] text-ink mb-3">

      <p className="text-[15px] text-ink/60 mb-8">
        Seus primeiros 14 dias são por nossa conta.
      </p>

      <Field label="Como você quer ser chamado?" error={err('name')}>
        <input
          type="text"
          placeholder="Seu primeiro nome"
          className={baseInput + (err('name') ? " !border-terra-300" : "")}
          value={form.name}
          onChange={(e) => setForm({ ...form, name: e.target.value })}
          onBlur={() => setTouched({ ...touched, name: true })}
          autoComplete="given-name"
        />
      </Field>

      <Field label="Email" error={err('email')}>
        <input
          type="email"
          placeholder="voce@email.com"
          className={baseInput + (err('email') ? " !border-terra-300" : "")}
          value={form.email}
          onChange={(e) => setForm({ ...form, email: e.target.value })}
          onBlur={() => setTouched({ ...touched, email: true })}
          autoComplete="email"
        />
      </Field>

      <Field label="Senha" error={err('password')}>
        <div className="relative">
          <input
            type={showPw ? 'text' : 'password'}
            placeholder="Mínimo 8 caracteres"
            className={baseInput + " pr-12 " + (err('password') ? " !border-terra-300" : "")}
            value={form.password}
            onChange={(e) => setForm({ ...form, password: e.target.value })}
            onBlur={() => setTouched({ ...touched, password: true })}
            autoComplete="new-password"
          />
          <button
            type="button"
            onClick={() => setShowPw(s => !s)}
            className="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-full text-ink/50 hover:text-ink hover:bg-stone2/50 transition-colors"
            aria-label={showPw ? "Ocultar senha" : "Mostrar senha"}
          >
            {showPw ? <IconEyeOff size={18}/> : <IconEye size={18}/>}
          </button>
        </div>
      </Field>

      {/* Terms */}
      <label className="flex items-start gap-3 mb-8 cursor-pointer select-none">
        <span className="mt-0.5 shrink-0">
          <span
            className={
              "w-5 h-5 rounded-md border flex items-center justify-center transition-all duration-300 " +
              (form.terms ? "bg-sage-500 border-sage-500" : "bg-white border-stone2")
            }
          >
            {form.terms && <IconCheck size={12} stroke={3} className="text-cream"/>}
          </span>
          <input
            type="checkbox"
            className="sr-only"
            checked={form.terms}
            onChange={(e) => { setForm({ ...form, terms: e.target.checked }); setTouched({ ...touched, terms: true }); }}
          />
        </span>
        <span className="text-[13.5px] text-ink/65 leading-[1.55]">
          Concordo com os <a href="#" className="text-ink underline decoration-stone2 underline-offset-2 hover:decoration-ink">Termos</a> e a <a href="#" className="text-ink underline decoration-stone2 underline-offset-2 hover:decoration-ink">Política de Privacidade</a>.
        </span>
      </label>
      {err('terms') && <div className="-mt-6 mb-6 text-[12.5px] text-terra-600">{errors.terms}</div>}

      <BtnPrimary type="submit" className="w-full !py-4 !text-[15.5px]" disabled={submitting}>
        {submitting ? (
          <span className="inline-flex items-center gap-2">
            <span className="w-3.5 h-3.5 rounded-full border-2 border-cream/40 border-t-cream animate-spin"/>
            criando sua conta...
          </span>
        ) : (
          <>Criar minha conta <IconArrowRight size={16}/></>
        )}
      </BtnPrimary>

      <p className="text-center text-[13.5px] text-ink/55 mt-6">
        Já tem conta? <Link to="/login" className="text-ink underline underline-offset-2 decoration-stone2 hover:decoration-ink">Entrar</Link>
      </p>
    </form>
  );
};

const CadastroPage = () => {
  const [submitting, setSubmitting] = React.useState(false);
  const [apiError, setApiError] = React.useState(null);
  const [, navigate] = useHashRoute();

  const submit = async (data) => {
    setSubmitting(true);
    setApiError(null);
    try {
      const res = await contigoApi('/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          nome: data.name,
          email: data.email,
          password: data.password,
        }),
      });
      // Salva token e dados básicos do usuário
      try {
        localStorage.setItem('contigo_token', res.token);
        localStorage.setItem('contigo_user', JSON.stringify({
          nome: res.user.nome,
          email: res.user.email,
        }));
        // Limpa estado antigo pra passar pelo onboarding
        localStorage.removeItem('contigo_state_v1');
      } catch {}
      window.location.href = 'Contigo App.html#/app/onboarding';
    } catch (err) {
      // Mostra erro humano
      if (err && err.error === 'CONFLICT') {
        setApiError('Já existe uma conta com esse email. Tente entrar.');
      } else if (err && err.error === 'VALIDATION_ERROR') {
        setApiError('Algum campo ficou inválido. Confira e tente de novo.');
      } else {
        setApiError('Não consegui criar sua conta agora. Tente de novo em um instante.');
      }
      setSubmitting(false);
    }
  };

  return (
    <div data-screen-label="02 Cadastro">
      <AuthShell>
        <FormCadastro onSubmit={submit} submitting={submitting}/>
        {apiError && (
          <div className="max-w-[440px] mx-auto md:mx-0 mt-4 px-4 py-3 rounded-2xl bg-terra-50 border border-terra-200 text-[13.5px] text-ink/80">
            {apiError}
          </div>
        )}
      </AuthShell>
    </div>
  );
};

/* -------------------- LOGIN -------------------- */
const FormLogin = ({ onSubmit, submitting }) => {
  const [form, setForm] = React.useState({ email: '', password: '' });
  const [touched, setTouched] = React.useState({});
  const [showPw, setShowPw] = React.useState(false);

  const errors = {
    email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email) ? 'Digite um email válido.' : null,
    password: form.password.length < 1 ? 'Preencha sua senha.' : null,
  };
  const err = (k) => (touched[k] ? errors[k] : null);

  const handleSubmit = (e) => {
    e.preventDefault();
    setTouched({ email: true, password: true });
    if (Object.values(errors).some(Boolean)) return;
    onSubmit(form);
  };

  return (
    <form onSubmit={handleSubmit} noValidate className="route-fade">
      <h1 className="font-display text-[38px] md:text-[44px] leading-[1.05] tracking-[-0.02em] text-ink mb-3">
        Que bom <span className="italic text-sage-700">te ver</span> de novo.
      </h1>
      <p className="text-[15px] text-ink/60 mb-8">
        Continue de onde parou.
      </p>

      <Field label="Email" error={err('email')}>
        <input
          type="email"
          placeholder="voce@email.com"
          className={baseInput + (err('email') ? " !border-terra-300" : "")}
          value={form.email}
          onChange={(e) => setForm({ ...form, email: e.target.value })}
          onBlur={() => setTouched({ ...touched, email: true })}
          autoComplete="email"
        />
      </Field>

      <Field label="Senha" error={err('password')}>
        <div className="relative">
          <input
            type={showPw ? 'text' : 'password'}
            placeholder="Sua senha"
            className={baseInput + " pr-12 " + (err('password') ? " !border-terra-300" : "")}
            value={form.password}
            onChange={(e) => setForm({ ...form, password: e.target.value })}
            onBlur={() => setTouched({ ...touched, password: true })}
            autoComplete="current-password"
          />
          <button
            type="button"
            onClick={() => setShowPw(s => !s)}
            className="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-full text-ink/50 hover:text-ink hover:bg-stone2/50 transition-colors"
            aria-label={showPw ? "Ocultar senha" : "Mostrar senha"}
          >
            {showPw ? <IconEyeOff size={18}/> : <IconEye size={18}/>}
          </button>
        </div>
      </Field>

      <div className="flex justify-end -mt-2 mb-6">
        <a href="#" className="text-[13px] text-ink/55 hover:text-ink transition-colors">
          Esqueci minha senha
        </a>
      </div>

      <BtnPrimary type="submit" className="w-full !py-4 !text-[15.5px]" disabled={submitting}>
        {submitting ? (
          <span className="inline-flex items-center gap-2">
            <span className="w-3.5 h-3.5 rounded-full border-2 border-cream/40 border-t-cream animate-spin"/>
            entrando...
          </span>
        ) : (
          <>Entrar <IconArrowRight size={16}/></>
        )}
      </BtnPrimary>

      <p className="text-center text-[13.5px] text-ink/55 mt-6">
        Primeira vez aqui? <Link to="/cadastro" className="text-ink underline underline-offset-2 decoration-stone2 hover:decoration-ink">Criar conta</Link>
      </p>
    </form>
  );
};

const LoginPage = () => {
  const [submitting, setSubmitting] = React.useState(false);
  const [apiError, setApiError] = React.useState(null);
  const [, navigate] = useHashRoute();

  const submit = async (data) => {
    setSubmitting(true);
    setApiError(null);
    try {
      const res = await contigoApi('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: data.email, password: data.password }),
      });
      try {
        localStorage.setItem('contigo_token', res.token);
        localStorage.setItem('contigo_user', JSON.stringify({
          nome: res.user.nome,
          email: res.user.email,
        }));
      } catch {}
      // Se já passou pelo onboarding, vai pra app; senão, pro onboarding.
      const onboarded = res.user && res.user.configuracoes && res.user.configuracoes.onboarded;
      window.location.href = 'Contigo App.html#' + (onboarded ? '/app' : '/app/onboarding');
    } catch (err) {
      if (err && err.error === 'UNAUTHORIZED') {
        setApiError('Email ou senha incorretos.');
      } else {
        setApiError('Não consegui entrar agora. Tente de novo em um instante.');
      }
      setSubmitting(false);
    }
  };

  return (
    <div data-screen-label="03 Login">
      <AuthShell>
        <FormLogin onSubmit={submit} submitting={submitting}/>
        {apiError && (
          <div className="max-w-[440px] mx-auto md:mx-0 mt-4 px-4 py-3 rounded-2xl bg-terra-50 border border-terra-200 text-[13.5px] text-ink/80">
            {apiError}
          </div>
        )}
      </AuthShell>
    </div>
  );
};

/* -------------------- SUCESSO (pós-cadastro) -------------------- */
const SucessoPage = () => {
  const user = (() => {
    try { return JSON.parse(localStorage.getItem('contigo_user') || '{}'); } catch { return {}; }
  })();
  const name = (user && user.name) ? user.name.split(' ')[0] : null;

  return (
    <div data-screen-label="04 Sucesso" className="min-h-screen bg-cream flex flex-col route-fade">
      <header className="px-6 md:px-10 py-5 flex items-center justify-between">
        <Link to="/"><Logo size={20}/></Link>
      </header>
      <main className="flex-1 flex items-center justify-center px-6">
        <div className="max-w-xl w-full text-center py-16 relative">
          {/* small animated dot */}
          <div className="mx-auto mb-8 w-14 h-14 rounded-full bg-sage-50 border border-sage-200 flex items-center justify-center">
            <div className="w-3 h-3 rounded-full bg-sage-500 animate-pulse"/>
          </div>
          <h1 className="font-display text-[42px] md:text-[52px] leading-[1.05] tracking-[-0.02em] text-ink mb-5">
            Bem-vindo{name ? `, ${name}` : ''}.
          </h1>
          <p className="text-[17px] leading-[1.55] text-ink/65 max-w-md mx-auto mb-10">
            Em breve você recebe seu primeiro check-in.
            Comece devagar — três toques por dia é tudo que a gente pede.
          </p>

          {/* timeline preview */}
          <div className="bg-white rounded-2xl border border-stone2/70 shadow-softer p-5 text-left max-w-sm mx-auto mb-10">
            <div className="text-[11px] tracking-[0.14em] uppercase text-ink/40 mb-3">seu dia</div>
            {[
              { time: '08h30', label: 'check-in da manhã', active: true },
              { time: '14h00', label: 'check-in da tarde' },
              { time: '21h30', label: 'check-in da noite' },
            ].map((s, i) => (
              <div key={i} className="flex items-center gap-3 py-2.5">
                <div className={"w-2 h-2 rounded-full " + (s.active ? "bg-sage-500" : "bg-stone2")}/>
                <span className="text-[13px] text-ink/60 w-12">{s.time}</span>
                <span className={"text-[14px] " + (s.active ? "text-ink" : "text-ink/50")}>{s.label}</span>
              </div>
            ))}
          </div>

          <Link to="/">
            <BtnGhost>Voltar pra home</BtnGhost>
          </Link>
        </div>
      </main>
    </div>
  );
};

Object.assign(window, { CadastroPage, LoginPage, SucessoPage, AuthShell });


/* Contigo — app root: route table */
/* eslint-disable */

const NotFound = () => (
  <div className="min-h-screen flex items-center justify-center bg-cream text-center px-6 route-fade">
    <div>
      <div className="font-display text-[48px] text-ink/30 mb-3">—</div>
      <p className="font-display text-[22px] text-ink mb-5">Essa página ainda não existe.</p>
      <Link to="/">
        <BtnGhost>Voltar pra home</BtnGhost>
      </Link>
    </div>
  </div>
);

const App = () => {
  const [route] = useHashRoute();
  const path = route.split('?')[0];

  let page;
  switch (path) {
    case '/':            page = <LandingPage/>; break;
    case '/cadastro':    page = <CadastroPage/>; break;
    case '/login':       page = <LoginPage/>; break;
    case '/sucesso':     page = <SucessoPage/>; break;
    default:             page = <NotFound/>;
  }

  return <div key={path}>{page}</div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
