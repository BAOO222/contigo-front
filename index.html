<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictX - Trade on anything</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header id="header"></header>

    <!-- Sub Navigation -->
    <div class="sub-nav" id="subNav"></div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Main Column -->
        <div>
            <!-- Featured Market -->
            <div class="market-section" id="featuredMarket">
                <!-- Será preenchido dinamicamente -->
            </div>

            <!-- All Markets -->
            <div class="section-header" style="margin-top: 40px;">
                <h2 style="font-size: 24px; font-weight: 700;">All Markets</h2>
                <div class="filter-pills" id="marketFilters"></div>
            </div>

            <div id="marketsList" class="markets-list"></div>

            <!-- Load More -->
            <div style="text-align: center; margin-top: 40px;">
                <button class="btn btn-secondary" onclick="loadMoreMarkets()">Load More Markets</button>
            </div>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar"></aside>
    </div>

    <script src="data.js"></script>
    <script src="components.js"></script>
    <script src="app.js"></script>
</body>
</html>
